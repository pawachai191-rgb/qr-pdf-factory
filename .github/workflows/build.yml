name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: # โค้ดบรรทัดนี้จะสร้างปุ่มให้เรากดสั่งรันเองได้!

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pillow reportlab pyinstaller
        
    - name: Build EXE using PyInstaller
      run: pyinstaller --noconsole --onefile app.py
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Factory-App-Windows
        path: dist/app.exe
