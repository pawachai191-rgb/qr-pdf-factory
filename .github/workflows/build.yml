name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest # สั่งให้รันบนเซิร์ฟเวอร์ Windows

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # ใช้ Python 3.10
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pillow reportlab pyinstaller
        
    - name: Build EXE using PyInstaller
      run: pyinstaller --noconsole --onefile app.py
      
    - name: Upload EXE
      uses: actions/upload-artifact@v3
      with:
        name: Factory-App-Windows # ชื่อโฟลเดอร์ที่จะให้ดาวน์โหลด
        path: dist/app.exe
